<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collect Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header>
    <h1 id="brand-logo" role="button" tabindex="0">📚 Collect Me</h1>
    <div id="auth-area"></div>
  </header>

  <nav class="main-nav">
    <button id="view-home" class="active">Accueil</button>
    <button id="view-collection">Ma collection</button>
  </nav>

  <main>
    <section id="home-view">
      <h2>Que veux-tu consulter aujourd'hui ?</h2>
      <div id="home-categories"></div>
    </section>

    <section id="catalogue-view" hidden>
      <button id="back-to-home" type="button" class="tab">← Toutes les collections</button>
      <h2 id="catalogue-title"></h2>

      <div id="external-search" hidden>
        <div class="search-wrapper">
          <input id="external-search-input" type="text" placeholder="Rechercher (titre, artiste...)" autocomplete="off" />
          <div id="external-search-results" class="dropdown-results" hidden></div>
        </div>
      </div>

      <div class="catalogue-columns">
        <div class="catalogue-main">
          <div class="catalogue-toolbar">
            <input id="catalogue-search" type="text" placeholder="Rechercher dans le catalogue..." autocomplete="off" />
            <select id="catalogue-sort">
              <option value="recent">Plus récents</option>
              <option value="title">Titre (A → Z)</option>
              <option value="year">Année</option>
            </select>
          </div>
          <div id="catalogue-list"></div>

          <form id="add-item-form">
            <label>
              Titre
              <input id="add-item-title" name="title" required />
            </label>
            <div id="add-item-fields" style="display:contents"></div>
            <button type="submit">Ajouter au catalogue</button>
          </form>
        </div>

        <aside class="catalogue-side">
          <div class="side-panel">
            <h3>Nouveaux ajouts de la communauté</h3>
            <div id="community-feed" class="scrolling-feed"></div>
          </div>
          <div class="side-panel">
            <h3>Références les plus consultées</h3>
            <div id="top-searches"></div>
          </div>
        </aside>
      </div>
    </section>

    <section id="collection-view" hidden>
      <div class="catalogue-toolbar">
        <input id="collection-search" type="text" placeholder="Rechercher dans ma collection..." autocomplete="off" />
        <select id="collection-filter"></select>
      </div>
      <div id="collection-list"></div>
    </section>

    <section id="detail-view" hidden>
      <button id="detail-back" type="button" class="tab">← Retour</button>
      <div id="detail-content"></div>
    </section>

    <section id="creator-view" hidden>
      <button id="creator-back" type="button" class="tab">← Retour</button>
      <h2 id="creator-title"></h2>
      <div id="creator-list"></div>
    </section>
  </main>

  <div id="item-bubble" class="item-bubble" hidden>
    <button id="item-bubble-close" class="item-bubble-close" type="button" aria-label="Fermer">×</button>
    <div id="item-bubble-content"></div>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
